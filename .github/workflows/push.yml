name: On push

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/checks.yml
  release:
    name: Release
    needs: checks
    permissions: write-all
    uses: ./.github/workflows/release.yml
    secrets: inherit
